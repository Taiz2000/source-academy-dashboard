<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Source Academy Grading Dashboard</title>
    <style>
      body {
        margin: 0;
        padding: 12px 14px;
        width: 260px;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 14px;
      }
      .toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 0;
        cursor: pointer;
      }
      .groups {
        margin-left: 24px;
      }
      .groups.disabled {
        opacity: 0.5;
      }
      .groups ul {
        margin: 4px 0;
        padding: 0;
        list-style: none;
      }
      .groups li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1px 0;
      }
      .groups li button {
        border: 0;
        background: none;
        cursor: pointer;
      }
      .groups form {
        display: flex;
        gap: 4px;
      }
      .groups input {
        flex: 1;
        min-width: 0;
      }
      .link {
        margin-top: 4px;
        padding: 0;
        border: 0;
        background: none;
        color: #2d72d2;
        cursor: pointer;
      }
      .muted {
        color: #738091;
      }
      .cache {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px solid #e5e8eb;
      }
      .cache .link {
        margin-top: 0;
      }
      .link:disabled {
        color: #a7b6c2;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="popup.js"></script>
  </body>
</html>
